# ─────────────────────────────────────────────
# BloomHR — Application Configuration
# Copy this file and fill in your real values
# ─────────────────────────────────────────────

app.name=BloomHR

# ── DATABASE (PostgreSQL) ──
spring.datasource.url=jdbc:postgresql://localhost:5432/bloomhr
spring.datasource.username=postgres
spring.datasource.password=GAURI06
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ──
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ── JWT ──
# Generate with: openssl rand -base64 64
jwt.secret=CHANGE_THIS_TO_A_LONG_RANDOM_256BIT_SECRET_KEY_AT_LEAST_32_CHARS
jwt.expiration=86400000

# ── EMAIL (Gmail SMTP) ──
# For Gmail: enable 2FA, then generate an App Password at myaccount.google.com/apppasswords
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=YOUR_EMAIL@gmail.com
spring.mail.password=YOUR_GMAIL_APP_PASSWORD
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ── SERVER ──
server.port=8080

# ── LOGGING ──
logging.level.com.bloomhr=INFO
logging.level.org.springframework.security=WARN
